name: "\U0001F527 CI"
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: |-
    ${{
      github.event_name != 'pull_request' ||
      github.actor != vars.RELEASE_BOT_LOGIN ||
      github.event.pull_request.head.repo.full_name != github.repository ||
      !startsWith(github.head_ref, 'release-please--branches--main--components--')
    }}
permissions:
  checks: read
  contents: read
  pull-requests: read
env:
  UV_NO_SYNC: 'true'
  PYTHONPATH: /tmp/instr
  BASH_ENV: /tmp/instr/bash_env.sh
jobs:
  text-hygiene:
    name: "\U0001F4DD Text Hygiene"
    if: github.event_name != 'push'
    runs-on: self-hosted
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
    - name: "\U0001F4CB Checkout Code"
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
        persist-credentials: false
    - name: "\U0001F40D Set up uv"
      uses: ./.github/actions/uv_setup
      with:
        python-version: '3.14'
        enable-cache: 'false'
    - name: "\U0001F4DD Run hygiene hooks on changed files"
      env:
        HYGIENE_FROM: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha
          }}
        HYGIENE_TO: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha
          }}
        PRE_COMMIT_COLOR: always
      run: |
        if make -C libs hygiene; then exit 0; fi
        # The fixing hooks leave their edits in the worktree; annotate each
        # changed hunk so the failure shows on the PR's diff and checks page
        # instead of only in this log.
        git diff -U0 --no-color | awk '
          /^\+\+\+ b\// { file = substr($0, 7) }
          /^@@/ {
            split($3, hunk, ",")
            line = substr(hunk[1], 2)
            printf "::error file=%s,line=%s,title=Text hygiene::Smart quotes, irregular spaces, trailing whitespace or a missing final newline. Run `make -C libs hygiene` and commit the fixes.\n", file, line
          }'
        echo "::error::Changed files fail text hygiene hooks. Run \`make -C libs hygiene\` locally and commit the fixes."
        exit 1
  changes:
    name: "\U0001F50D Detect Changes"
    runs-on: self-hosted
    outputs:
      deepagents: ${{ steps.curated-apply.outputs.only != 'true' && steps.filter.outputs.deepagents
        == 'true' }}
      code: ${{ steps.curated-apply.outputs.only != 'true' && steps.filter.outputs.code
        == 'true' }}
      talon: ${{ steps.curated-apply.outputs.only != 'true' && steps.filter.outputs.talon
        == 'true' }}
      talon-src: ${{ steps.curated-apply.outputs.only != 'true' && steps.filter.outputs.talon-src
        == 'true' }}
      evals: ${{ steps.curated-apply.outputs.only != 'true' && steps.filter.outputs.evals
        == 'true' }}
      acp: ${{ steps.curated-apply.outputs.only != 'true' && steps.filter.outputs.acp
        == 'true' }}
      daytona: ${{ steps.curated-apply.outputs.only != 'true' && steps.filter.outputs.daytona
        == 'true' }}
      modal: ${{ steps.curated-apply.outputs.only != 'true' && steps.filter.outputs.modal
        == 'true' }}
      runloop: ${{ steps.curated-apply.outputs.only != 'true' && steps.filter.outputs.runloop
        == 'true' }}
      vercel: ${{ steps.curated-apply.outputs.only != 'true' && steps.filter.outputs.vercel
        == 'true' }}
      quickjs: ${{ steps.curated-apply.outputs.only != 'true' && steps.filter.outputs.quickjs
        == 'true' }}
      curated-apply-only: ${{ steps.curated-apply.outputs.only || 'false' }}
      curated-apply-parent-conclusion: ${{ steps.curated-apply.outputs.prior-conclusion
        }}
      curated-apply-parent-sha: ${{ steps.curated-apply.outputs.parent-sha }}
      curated-apply-parent-check: ${{ steps.curated-apply.outputs.parent-check }}
    steps:
    - name: "\U0001F4CB Checkout Code"
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: ${{ (github.event_name == 'pull_request' && !startsWith(github.head_ref,
          'release-please--')) && 1 || 0 }}
    - name: "\U0001F4CB Checkout detector from trusted base ref"
      if: github.event_name == 'pull_request' && github.actor == vars.RELEASE_BOT_LOGIN
        && github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref,
        'release-please--branches--main--components--')
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ github.base_ref }}
        path: .curated-apply-base
        persist-credentials: false
        sparse-checkout: |
          .github/scripts/checks/curated_apply_only.py
          release-please-config.json
    - name: "\U0001F4DD Detect a changelog-only curated-notes apply"
      id: curated-apply
      if: github.event_name == 'pull_request' && github.actor == vars.RELEASE_BOT_LOGIN
        && github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref,
        'release-please--branches--main--components--')
      env:
        BOT_LOGIN: ${{ vars.RELEASE_BOT_LOGIN }}
        BOT_ID: ${{ vars.RELEASE_BOT_ID }}
        GH_TOKEN: ${{ github.token }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        HEAD_REF: ${{ github.head_ref }}
      run: "only=\"$(python3 .curated-apply-base/.github/scripts/checks/curated_apply_only.py\
        \ \\\n  --repo \"$GITHUB_WORKSPACE\" \\\n  --config .curated-apply-base/release-please-config.json\
        \ \\\n  --head \"$HEAD_SHA\" \\\n  --branch \"$HEAD_REF\" \\\n  --bot-login\
        \ \"$BOT_LOGIN\" \\\n  --bot-id \"$BOT_ID\")\"\nif [ \"$only\" = true ]; then\n\
        \  parent=\"$(git rev-parse \"$HEAD_SHA^\")\"\n  parent_check=\"$(gh api \\\
        \n    -H 'X-GitHub-Api-Version: 2022-11-28' \\\n    \"repos/$GITHUB_REPOSITORY/commits/$parent/check-runs?check_name=%E2%9C%85%20CI%20Success&filter=latest&per_page=100\"\
        \ \\\n    --jq '[.check_runs[] | select(.name == \"\u2705 CI Success\")] |\
        \ if length == 1 then .[0] | {id, conclusion, details_url, check_suite: {id:\
        \ .check_suite.id}} else {} end' \\\n    2>/dev/null || true)\"\n  if ! parent_check=\"\
        $(printf '%s' \"$parent_check\" | jq -cs 'if length == 1 and (.[0] | type)\
        \ == \"object\" then .[0] else {} end' 2>/dev/null)\"; then\n    parent_check='{}'\n\
        \  fi\n  conclusion=\"$(printf '%s' \"$parent_check\" | jq -r '.conclusion\
        \ // \"\"')\"\n  case \"$conclusion\" in\n    success|failure) ;;\n    *)\n\
        \      only=false\n      conclusion=''\n      echo \"Prior CI is not conclusive;\
        \ running the normal package jobs.\"\n      ;;\n  esac\nfi\necho \"only=$only\"\
        \ >> \"$GITHUB_OUTPUT\"\necho \"prior-conclusion=${conclusion:-}\" >> \"$GITHUB_OUTPUT\"\
        \necho \"parent-sha=${parent:-}\" >> \"$GITHUB_OUTPUT\"\necho \"parent-check=${parent_check:-}\"\
        \ >> \"$GITHUB_OUTPUT\"\n"
    - name: "\U0001F50D Check for changes"
      uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d
      id: filter
      with:
        filters: "deepagents:\n  - 'libs/deepagents/**'\n  - '.github/workflows/ci.yml'\n\
          \  - '.github/workflows/_lint.yml'\n  - '.github/workflows/_test.yml'\n\
          \  - '.github/actions/**'\ncode:\n  - 'libs/code/**'\n  - 'libs/deepagents/**'\n\
          \  - '.github/workflows/ci.yml'\n  - '.github/workflows/_lint.yml'\n  -\
          \ '.github/workflows/_test.yml'\n  - '.github/actions/**'\ntalon:\n  - 'libs/talon/**'\n\
          \  - 'libs/deepagents/**'\n  - 'libs/code/**'\n  - '.github/workflows/ci.yml'\n\
          \  - '.github/workflows/_lint.yml'\n  - '.github/workflows/_test.yml'\n\
          \  - '.github/actions/**'\n# The broad `talon` filter above decides whether\
          \ talon CI RUNS;\n# this narrow one decides whether the PR TOUCHES talon\
          \ sources.\n# `ci_success` and the talon-failure-advisory job key off this\n\
          # output, so libs/code PRs (which match the broad filter via\n# 'libs/code/**')\
          \ get the talon failure waiver.\ntalon-src:\n  - 'libs/talon/**'\nevals:\n\
          \  - 'libs/evals/**'\n  - 'libs/deepagents/**'\n  # The evals test suite\
          \ asserts on its own workflow files (e.g.\n  # test_harbor_langsmith_integration.py\
          \ reads harbor.yml and\n  # _eval.yml), so editing any eval workflow must\
          \ run the evals\n  # tests that validate it \u2014 otherwise the change\
          \ skips its guard.\n  - '.github/workflows/evals.yml'\n  - '.github/workflows/harbor.yml'\n\
          \  - '.github/workflows/_harbor_run.yml'\n  - '.github/workflows/unified_evals.yml'\n\
          \  - '.github/workflows/clbench.yml'\n  - '.github/workflows/evals_trials.yml'\n\
          \  - '.github/workflows/_eval.yml'\n  - '.github/workflows/ci.yml'\n  -\
          \ '.github/workflows/_lint.yml'\n  - '.github/workflows/_test.yml'\n  -\
          \ '.github/actions/**'\nacp:\n  - 'libs/acp/**'\n  - 'libs/deepagents/**'\n\
          \  - '.github/workflows/ci.yml'\n  - '.github/workflows/_lint.yml'\n  -\
          \ '.github/workflows/_test.yml'\n  - '.github/actions/**'\ndaytona:\n  -\
          \ 'libs/partners/daytona/**'\n  - 'libs/deepagents/**'\n  - '.github/workflows/ci.yml'\n\
          \  - '.github/workflows/_lint.yml'\n  - '.github/workflows/_test.yml'\n\
          \  - '.github/actions/**'\nmodal:\n  - 'libs/partners/modal/**'\n  - 'libs/deepagents/**'\n\
          \  - '.github/workflows/ci.yml'\n  - '.github/workflows/_lint.yml'\n  -\
          \ '.github/workflows/_test.yml'\n  - '.github/actions/**'\nrunloop:\n  -\
          \ 'libs/partners/runloop/**'\n  - 'libs/deepagents/**'\n  - '.github/workflows/ci.yml'\n\
          \  - '.github/workflows/_lint.yml'\n  - '.github/workflows/_test.yml'\n\
          \  - '.github/actions/**'\nvercel:\n  - 'libs/partners/vercel/**'\n  - 'libs/deepagents/**'\n\
          \  - '.github/workflows/ci.yml'\n  - '.github/workflows/_lint.yml'\n  -\
          \ '.github/workflows/_test.yml'\n  - '.github/actions/**'\nquickjs:\n  -\
          \ 'libs/partners/quickjs/**'\n  - 'libs/deepagents/**'\n  - '.github/workflows/ci.yml'\n\
          \  - '.github/workflows/_lint.yml'\n  - '.github/workflows/_test.yml'\n\
          \  - '.github/actions/**'\n"
    timeout-minutes: 45
  test-quickjs-sdk-smoke:
    name: "\U0001F9EA Test quickjs SDK smoke"
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'push' && needs.changes.outputs.deepagents
      == 'true' && needs.changes.outputs.quickjs != 'true') }}
    runs-on: self-hosted
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      UV_FROZEN: 'true'
    defaults:
      run:
        working-directory: libs/partners/quickjs
    steps:
    - name: "\U0001F4CB Checkout Code"
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - name: "\U0001F40D Set up Python 3.11 + UV"
      uses: ./.github/actions/uv_setup
      with:
        python-version: '3.11'
        cache-suffix: test-quickjs-sdk-smoke
        working-directory: libs/partners/quickjs
    - name: "\U0001F4E6 Install Test Dependencies"
      shell: bash
      run: uv sync --group test
    - name: "\U0001F50D Verify Smoke Test Path"
      shell: bash
      run: |
        set -eu
        test -f tests/unit_tests/smoke_tests/test_system_prompt.py || {
          echo "::error::quickjs smoke test file moved or renamed; update its path in ci.yml"
          exit 1
        }
    - name: "\U0001F9EA Run quickjs prompt smoke tests"
      shell: bash
      run: uv run --group test pytest --disable-socket --allow-unix-socket tests/unit_tests/smoke_tests/test_system_prompt.py
    - name: "\U0001F9F9 Verify Clean Working Directory"
      shell: bash
      run: |
        set -eu
        STATUS="$(git status)"
        echo "$STATUS"
        echo "$STATUS" | grep 'nothing to commit, working tree clean'
  drbench-dataset:
    name: "\U0001F5C2\uFE0F Build DRBench dataset"
    needs: changes
    if: ${{ !cancelled() && (needs.changes.outputs.evals == 'true' || github.event_name
      == 'push') }}
    runs-on: self-hosted
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      UV_FROZEN: 'true'
    defaults:
      run:
        working-directory: libs/evals
    steps:
    - name: "\U0001F4CB Checkout Code"
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - name: "\U0001F40D Set up Python 3.14 + UV"
      uses: ./.github/actions/uv_setup
      with:
        python-version: '3.14'
        cache-suffix: drbench-dataset
        working-directory: libs/evals
    - name: "\U0001F4E6 Install Dependencies"
      shell: bash
      run: uv sync
    - name: "\U0001F501 Verify generation is deterministic"
      shell: bash
      run: make dataset-check
    - name: "\U0001F5C2\uFE0F Build the dataset in place"
      shell: bash
      run: make dataset
    - name: "\U0001F9F9 Verify Clean Working Directory"
      shell: bash
      run: |
        set -eu
        STATUS="$(git status)"
        echo "$STATUS"
        echo "$STATUS" | grep 'nothing to commit, working tree clean'
  check-release-options:
    name: Validate Release Options
    needs: changes
    if: ${{ !cancelled() && (needs.changes.outputs.curated-apply-only != 'true') }}
    runs-on: self-hosted
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - name: "\U0001F40D Setup Python 3.14"
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
      with:
        python-version: '3.14'
    - name: "\U0001F7E2 Setup Node"
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      with:
        node-version: '24'
    - name: "\U0001F4E6 Install Dependencies"
      run: python -m pip install packaging pyyaml pytest
    - name: "\U0001F50D Check workflow helper scripts"
      run: python -m pytest .github/scripts/tests -v
    timeout-minutes: 45
  talon-failure-advisory:
    name: "\u26A0\uFE0F talon failure advisory"
    needs:
    - changes
    if: ${{ !cancelled() && (always() && github.event_name == 'pull_request' && needs.changes.outputs.curated-apply-only
      != 'true' && needs.changes.outputs.talon-src != 'true') }}
    runs-on: self-hosted
    timeout-minutes: 45
    permissions:
      pull-requests: write
    concurrency:
      group: talon-ci-advisory-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
    - name: Post, update, or delete the talon advisory comment
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
      with:
        script: "const { owner, repo } = context.repo;\nconst prNumber = context.payload.pull_request?.number;\n\
          if (!prNumber) {\n  core.warning('No PR number in payload; skipping talon\
          \ advisory comment.');\n  return;\n}\nconst STICKY_MARKER = '<!-- talon-ci-advisory\
          \ -->';\n\nasync function findStickyComment() {\n  const comments = await\
          \ github.paginate(github.rest.issues.listComments, {\n    owner, repo, issue_number:\
          \ prNumber, per_page: 100,\n  });\n  return comments.find(c => c.body &&\
          \ c.body.startsWith(STICKY_MARKER));\n}\n\nconst jobNames = ['lint-talon',\
          \ 'test-talon'];\nconst jobResults = {\n  'lint-talon': '${{ needs.lint-talon.result\
          \ }}',\n  'test-talon': '${{ needs.test-talon.result }}',\n};\nconst failed\
          \ = jobNames.filter(j => jobResults[j] === 'failure');\n\nasync function\
          \ removeSticky() {\n  try {\n    const existing = await findStickyComment();\n\
          \    if (existing) {\n      await github.rest.issues.deleteComment({\n \
          \       owner, repo, comment_id: existing.id,\n      });\n      console.log('talon\
          \ jobs green (or not run) \u2014 deleted advisory comment');\n    }\n  }\
          \ catch (e) {\n    core.warning(`Could not clean up talon advisory comment\
          \ for PR #${prNumber}: ${e.message}`);\n  }\n}\n\n// Waiver condition no\
          \ longer holds: talon passed or was skipped.\nif (failed.length === 0) {\n\
          \  await removeSticky();\n  return;\n}\n\nconst runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;\n\
          const body = [\n  STICKY_MARKER,\n  '\u26A0\uFE0F **talon CI failure(s)\
          \ were waived for this PR.**',\n  '',\n  `Failed job(s): ${failed.map(j\
          \ => `\\`${j}\\``).join(', ')} ([workflow run](${runUrl}))`,\n  '',\n  \"\
          **Why:** this PR doesn't touch `libs/talon`, so talon breakage does not\
          \ block merge per repo policy. talon editable-installs `deepagents-code`,\
          \ so its CI runs on every libs/code PR and can be broken by libs/code changes.\"\
          ,\n  '',\n  '**Required follow-up:** the breakage must be fixed in a separate\
          \ `fix(talon): ...` PR \u2014 talon is red at HEAD until it lands. Please\
          \ file or self-assign that fix, or confirm a maintainer is tracking it.',\n\
          ].join('\\n');\n\ntry {\n  const existing = await findStickyComment();\n\
          \  if (existing) {\n    if (existing.body !== body) {\n      await github.rest.issues.updateComment({\n\
          \        owner, repo, comment_id: existing.id, body,\n      });\n      console.log('Updated\
          \ talon advisory comment');\n    } else {\n      console.log('talon advisory\
          \ comment already up to date');\n    }\n  } else {\n    await github.rest.issues.createComment({\n\
          \      owner, repo, issue_number: prNumber, body,\n    });\n    console.log('Posted\
          \ talon advisory comment');\n  }\n} catch (commentErr) {\n  core.warning(`Could\
          \ not post talon advisory comment (fork PR token, rate limit, or transient\
          \ API error): ${commentErr.message}`);\n  await core.summary\n    .addHeading('talon\
          \ CI failure(s) waived; advisory comment could not be posted')\n    .addRaw('Paste\
          \ the following into the PR as a comment:')\n    .addCodeBlock(body, 'markdown')\n\
          \    .write();\n}\n"
  ci_success:
    name: "\u2705 CI Success"
    needs:
    - changes
    - text-hygiene
    - test-quickjs-sdk-smoke
    - drbench-dataset
    - check-release-options
    if: ${{ !cancelled() && (always()) }}
    runs-on: self-hosted
    steps:
    - name: "\U0001F4CB Checkout gate script from trusted base ref"
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ github.base_ref || github.sha }}
        path: .ci-gate-base
        sparse-checkout: |
          .github/scripts/checks/ci_gate.py
        persist-credentials: false
    - name: "\U0001F4CB Checkout PR gate script (bootstrap fallback)"
      if: ${{ github.event_name == 'pull_request' }}
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        path: .ci-gate-pr
        sparse-checkout: |
          .github/scripts/checks/ci_gate.py
        persist-credentials: false
    - name: Report inherited CI failure
      if: needs.changes.outputs.curated-apply-only == 'true' && needs.changes.outputs.curated-apply-parent-conclusion
        == 'failure'
      continue-on-error: true
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
      env:
        PARENT_SHA: ${{ needs.changes.outputs.curated-apply-parent-sha }}
        PARENT_CHECK: ${{ needs.changes.outputs.curated-apply-parent-check }}
      with:
        script: "const { owner, repo } = context.repo;\nconst repoUrl = `${process.env.GITHUB_SERVER_URL}/${owner}/${repo}`;\n\
          const parentUrl = `${repoUrl}/commit/${process.env.PARENT_SHA}`;\nconst\
          \ message = 'This curated-notes-only commit inherits failed parent CI. Package\
          \ jobs were skipped, not passed; the CI Success gate remains failed.';\n\
          core.error(`${message} Parent commit: ${parentUrl}`);\nconst currentRunUrl\
          \ = `${repoUrl}/actions/runs/${context.runId}`;\nconst lines = [message,\
          \ '', `Parent commit: ${parentUrl}`];\nlet parentRunId;\nconst jobUrl =\
          \ value => {\n  const prefix = `${repoUrl}/actions/runs/`;\n  return typeof\
          \ value === 'string' && value.startsWith(prefix) &&\n    /^\\d+\\/job\\\
          /\\d+$/.test(value.slice(prefix.length)) ? value : '';\n};\nconst escape\
          \ = value => String(value).replace(/[&<>\"']/g, char => ({\n  '&': '&amp;',\
          \ '<': '&lt;', '>': '&gt;', '\"': '&quot;', \"'\": '&#39;',\n})[char]);\n\
          try {\n  const check = JSON.parse(process.env.PARENT_CHECK);\n  const url\
          \ = jobUrl(check.details_url);\n  if (url) {\n    parentRunId = url.split('/job/')[0].split('/').pop();\n\
          \    lines.push(`Parent CI run: ${url.split('/job/')[0]}`, `Parent CI Success\
          \ check: ${url}`);\n    core.info(lines.slice(-2).join('\\n'));\n  }\n \
          \ const checks = await github.paginate(github.rest.checks.listForSuite,\
          \ {\n    owner, repo, check_suite_id: check.check_suite.id,\n    filter:\
          \ 'latest', per_page: 100,\n  });\n  const failed = checks.filter(candidate\
          \ => candidate.id !== check.id &&\n    ['failure', 'cancelled', 'timed_out',\
          \ 'action_required', 'startup_failure', 'stale'].includes(candidate.conclusion));\n\
          \  lines.push('', 'Unsuccessful checks currently reported by the parent\
          \ CI suite (may change after reruns):');\n  for (const candidate of failed)\
          \ {\n    const link = jobUrl(candidate.details_url);\n    core.error(`Parent\
          \ job ${JSON.stringify(candidate.name)} concluded ${candidate.conclusion}.\
          \ Inspect ${link || parentUrl}`, {\n      title: 'Inherited parent CI failure',\n\
          \    });\n    lines.push(`- <code>${escape(candidate.name)}</code>: ${candidate.conclusion}${link\
          \ ? ` \u2014 ${link}` : ''}`);\n  }\n  if (!failed.length) {\n    const\
          \ fallback = 'No unsuccessful sibling checks are currently available; inspect\
          \ the linked parent CI check/run. The captured inherited failure is unchanged.';\n\
          \    core.info(fallback);\n    lines.push(fallback);\n  }\n} catch {\n \
          \ const fallback = 'Parent check details could not be retrieved; inspect\
          \ the parent commit checks. The inherited failure is unchanged.';\n  core.warning(fallback);\n\
          \  lines.push('', fallback);\n}\nlines.push('', '### Troubleshoot and retry',\n\
          \  '1. Open the unsuccessful parent job above and inspect its failing step.\
          \ Fix a real failure through the normal PR/release refresh flow; retry only\
          \ if the failure is transient.',\n  `2. For a transient failure, open the\
          \ parent CI run and choose **Re-run failed jobs**${parentRunId ? ` (\\`gh\
          \ run rerun ${parentRunId} --failed --repo ${owner}/${repo}\\`)` : ''}.\
          \ Wait for its **CI Success** check to pass.`,\n  `3. Open [this head workflow\
          \ run](${currentRunUrl}) and choose **Re-run all jobs** (\\`gh run rerun\
          \ ${context.runId} --repo ${owner}/${repo}\\`) to re-read the parent result.\
          \ **Re-run failed jobs** alone reuses the old detection output and will\
          \ still inherit the failure.`,\n  '', 'Skipped package jobs are not passing\
          \ tests. This head is only green after its own CI Success check passes.');\n\
          await core.summary.addHeading('Inherited parent CI failure').addRaw(lines.join('\\\
          n')).write();\n"
    - name: "\U0001F389 All Checks Passed"
      env:
        EVENT_NAME: ${{ github.event_name }}
        LOCKFILES_RESULT: ${{ needs.check-lockfiles.result }}
        HYGIENE_RESULT: ${{ needs.text-hygiene.result }}
        CURATED_APPLY_ONLY: ${{ needs.changes.outputs.curated-apply-only }}
        CURATED_APPLY_PARENT_CONCLUSION: ${{ needs.changes.outputs.curated-apply-parent-conclusion
          }}
        NEEDS: ${{ toJSON(needs) }}
        TALON_CHANGED: ${{ needs.changes.outputs.talon-src }}
      run: "set -euo pipefail\nif [ \"$LOCKFILES_RESULT\" != success ]; then\n  echo\
        \ \"Lockfile validation did not pass: $LOCKFILES_RESULT\"\n  exit 1\nfi\n\
        # Text hygiene only runs on pull_request and merge_group.\nif [ \"$HYGIENE_RESULT\"\
        \ != success ] && ! { [ \"$EVENT_NAME\" = push ] && [ \"$HYGIENE_RESULT\"\
        \ = skipped ]; }; then\n  echo \"Text hygiene validation did not pass: $HYGIENE_RESULT\"\
        \n  exit 1\nfi\nif [ \"$CURATED_APPLY_ONLY\" = true ]; then\n  if [ \"$CURATED_APPLY_PARENT_CONCLUSION\"\
        \ = success ]; then\n    echo \"The release-bot commit only updates the managed\
        \ changelog; prior-head CI passed.\"\n    exit 0\n  fi\n  echo \"Prior-head\
        \ CI failed; refusing to pass the changelog-only apply commit.\"\n  exit 1\n\
        fi\n# Get all job results (excluding 'changes' which always succeeds)\nresults=\"\
        $(printf '%s' \"$NEEDS\" | python3 -c '\nimport json\nimport sys\n\nneeds\
        \ = json.loads(sys.argv[1])\nresults = {\n    job: entry[\"result\"]\n   \
        \ for job, entry in needs.items()\n    if job != \"changes\" and entry[\"\
        result\"] != \"skipped\"\n}\njson.dump(results, sys.stdout)\n' \"$NEEDS\"\
        )\"\necho \"Job results: $results\"\n\ngate_script=\".ci-gate-base/.github/scripts/checks/ci_gate.py\"\
        \nif [ ! -f \"$gate_script\" ]; then\n  # Bootstrap only: the script is not\
        \ on the base branch yet.\n  gate_script=\".ci-gate-pr/.github/scripts/checks/ci_gate.py\"\
        \n  echo \"::warning::ci_gate.py not found on base ref; running the PR's copy\
        \ (bootstrap window).\"\nfi\n\ngate=\"$(python3 \"$gate_script\" \\\n  --event\
        \ \"$EVENT_NAME\" \\\n  --talon \"$TALON_CHANGED\" \\\n  --results \"$results\"\
        )\"\necho \"Gate decision: $gate\"\n\nwaived=\"$(printf '%s' \"$gate\" | python3\
        \ -c 'import json, sys; print(\"\\n\".join(json.loads(sys.argv[1])[\"waived\"\
        ]))' \"$gate\")\"\nif [ -n \"$waived\" ]; then\n  while IFS= read -r job;\
        \ do\n    echo \"::warning::\u26A0\uFE0F Waiving failing talon check: $job=failure\
        \ (PR does not touch libs/talon; talon breakage is advisory here). Follow-up:\
        \ fix talon in a separate fix(talon): ... PR.\"\n  done <<< \"$waived\"\n\
        fi\n\nfailed=\"$(printf '%s' \"$gate\" | python3 -c 'import json, sys; print(\"\
        \\n\".join(json.loads(sys.argv[1])[\"failed\"]))' \"$gate\")\"\nif [ -n \"\
        $failed\" ]; then\n  echo \"Some jobs failed:\"\n  echo \"$failed\"\n  exit\
        \ 1\nfi\n\n# On main pushes, concurrency preemption routinely cancels\n# in-flight\
        \ jobs when a newer commit arrives \u2014 the next run will\n# validate the\
        \ latest state, so don't flag those as failures.\n# On PRs and merge_group\
        \ runs, a cancellation is almost always a\n# human action or a real problem,\
        \ so keep the gate strict.\nif [ \"$EVENT_NAME\" != \"push\" ]; then\n  cancelled=\"\
        $(printf '%s' \"$gate\" | python3 -c 'import json, sys; print(\"\\n\".join(json.loads(sys.argv[1])[\"\
        cancelled\"]))' \"$gate\")\"\n  if [ -n \"$cancelled\" ]; then\n    echo \"\
        Some jobs were cancelled (not allowed on $EVENT_NAME runs):\"\n    echo \"\
        $cancelled\"\n    exit 1\n  fi\nfi\n\necho \"All required checks passed (skipped\
        \ jobs are OK)\"\nexit 0\n"
    timeout-minutes: 45
'on':
  push:
    branches:
    - main
  pull_request: null
  merge_group: null
